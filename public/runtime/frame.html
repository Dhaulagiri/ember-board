<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
      body { margin: 0; padding: 16px; }
      button, input, select, textarea { font: inherit; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The sandboxed frame has an opaque origin, so it can't fetch the runtime
      // itself behind auth or CORS: the host posts the runtime's source instead.
      addEventListener("message", function boot(event) {
        if (event.data && event.data.type === "boot") {
          removeEventListener("message", boot)
          new Function(event.data.code)()
        }
      })
      parent.postMessage({ type: "loaded" }, "*")
    </script>
  </body>
</html>
